[platformio]
src_dir = .
build_dir = C:/Users/MR_STORM/.pio_build/job_team
default_envs = NAP_MACH_RELAY

[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink

[env:NAP_MACH_RELAY]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_RELAY/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_RELAY" -DCHE_DO_THOI_GIAN=1

[env:NAP_MACH_RELAY_GIO_CU]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_RELAY/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_RELAY" -DCHE_DO_THOI_GIAN=2

[env:NAP_MACH_AM_THANH]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_SOUND/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_SOUND" -DCHE_DO_THOI_GIAN=1

[env:NAP_MACH_AM_THANH_GIO_CU]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_SOUND/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_SOUND" -DCHE_DO_THOI_GIAN=2

[env:NAP_MACH_JUMPSCARE]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_JUMPSCARE/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_JUMPSCARE"

[env:TEST_NAP_CODE]
