[platformio]
src_dir = .
build_dir = C:/Users/MR_STORM/.pio_build/job_team
default_envs = TEST_STM32_CHIP_ALIVE

[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink


[env:NAP_MACH_RELAY]
build_src_filter = -<*> +<JOB_2_HAUNTED_HOUSE/STM32_RELAY/*.cpp>
build_flags = -I"JOB_2_HAUNTED_HOUSE/STM32_RELAY" -DCHE_DO_THOI_GIAN=1

